# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore QPET.sln
    - name: Build
      run: dotnet build QPET.sln --no-restore
    - name: Test
      run: dotnet test QPET.sln --no-build --verbosity normal

  deploy:
    name: Deploy to production
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    concurrency:
      group: qpet-production-deployment
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish application
      run: dotnet publish QPET/QPET.csproj -c Release -r linux-x64 --self-contained false -o publish

    - name: Package application
      run: tar -czf qpet-publish.tar.gz -C publish .

    - name: Configure deployment SSH
      env:
        QPET_DEPLOY_KEY: ${{ secrets.QPET_DEPLOY_KEY }}
        QPET_SSH_KNOWN_HOSTS: ${{ secrets.QPET_SSH_KNOWN_HOSTS }}
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$QPET_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/qpet_github_deploy
        chmod 600 ~/.ssh/qpet_github_deploy
        printf '%s\n' "$QPET_SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - name: Upload deployment package
      env:
        QPET_DEPLOY_HOST: ${{ secrets.QPET_DEPLOY_HOST }}
        QPET_DEPLOY_USER: ${{ secrets.QPET_DEPLOY_USER }}
      run: |
        scp \
          -i ~/.ssh/qpet_github_deploy \
          -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=yes \
          qpet-publish.tar.gz \
          "$QPET_DEPLOY_USER@$QPET_DEPLOY_HOST:/home/$QPET_DEPLOY_USER/qpet-publish.tar.gz"

    - name: Deploy application
      env:
        QPET_DEPLOY_HOST: ${{ secrets.QPET_DEPLOY_HOST }}
        QPET_DEPLOY_USER: ${{ secrets.QPET_DEPLOY_USER }}
      run: |
        ssh \
          -i ~/.ssh/qpet_github_deploy \
          -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=yes \
          "$QPET_DEPLOY_USER@$QPET_DEPLOY_HOST" \
          "sudo /usr/local/sbin/qpet-deploy"